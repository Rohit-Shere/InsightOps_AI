
services:
  db:
    image: postgres:16
    container_name: insightops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: insightops
      POSTGRES_USER: insightops_user
      POSTGRES_PASSWORD: test123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightops_user -d insightops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
